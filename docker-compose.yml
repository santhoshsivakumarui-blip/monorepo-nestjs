name: platform
services:
  api-gateway:
    build: { context: ., args: { APP: api-gateway } }
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [postgres, redis, kafka, rabbitmq, elasticsearch]
  users:
    build: { context: ., args: { APP: users } }
    env_file: .env
    environment: { DATABASE_URL: postgresql://platform:platform@postgres:5432/users_db }
    depends_on: [kafka, postgres]
  orders:
    build: { context: ., args: { APP: orders } }
    env_file: .env
    environment: { DATABASE_URL: postgresql://platform:platform@postgres:5432/orders_db }
    depends_on: [kafka, postgres, redis]
  notifications:
    build: { context: ., args: { APP: notifications } }
    env_file: .env
    environment: { DATABASE_URL: postgresql://platform:platform@postgres:5432/notifications_db }
    depends_on: [rabbitmq]
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data, ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-platform.sql:ro]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: platform, RABBITMQ_DEFAULT_PASS: platform }
    ports: ["5672:5672", "15672:15672"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    profiles: [platform]
    command: start-dev --import-realm
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only }
    ports: ["8080:8080"]
    volumes: [./platform/keycloak:/opt/keycloak/data/import:ro]
  openfga:
    image: openfga/openfga:v1.8.5
    profiles: [platform]
    command: run
    ports: ["8081:8080"]
  kong:
    image: kong:3.9
    profiles: [platform]
    environment: { KONG_DATABASE: "off", KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml, KONG_PROXY_LISTEN: 0.0.0.0:8000, KONG_ADMIN_LISTEN: 0.0.0.0:8001 }
    ports: ["8000:8000", "8001:8001"]
    volumes: [./platform/kong/kong.yml:/kong/declarative/kong.yml:ro]
    depends_on: [api-gateway]
  mailpit:
    image: axllent/mailpit:v1.22
    profiles: [platform]
    ports: ["1025:1025", "8025:8025"]
  localstack:
    image: localstack/localstack:4.1
    profiles: [platform]
    environment: { SERVICES: s3,sqs,sns, DEFAULT_REGION: us-east-1 }
    ports: ["4566:4566"]
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
volumes:
  postgres-data: {}
  redis-data: {}
  elasticsearch-data: {}
