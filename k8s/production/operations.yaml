apiVersion: v1
kind: ServiceAccount
metadata: { name: api-gateway, namespace: platform }
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api-gateway, namespace: platform }
spec: { minAvailable: 1, selector: { matchLabels: { app: api-gateway } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: platform
  annotations: { nginx.ingress.kubernetes.io/ssl-redirect: "true" }
spec:
  tls: [{ hosts: [api.example.com], secretName: platform-tls }]
  rules:
    - host: api.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: api-gateway, port: { number: 80 } } } }] }
