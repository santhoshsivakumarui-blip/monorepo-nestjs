apiVersion: v1
kind: ServiceAccount
metadata: { name: api-gateway, namespace: platform }
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api-gateway, namespace: platform }
spec: { minAvailable: 1, selector: { matchLabels: { app: api-gateway } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: platform
  annotations: { nginx.ingress.kubernetes.io/ssl-redirect: "true" }
spec:
  tls: [{ hosts: [api.example.com], secretName: platform-tls }]
  rules:
    - host: api.example.com
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend:
                  { service: { name: api-gateway, port: { number: 80 } } },
              },
            ],
        }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: users-outbox-relay
  namespace: platform
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: users-outbox-relay
              image: platform/users:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "npm run outbox:relay"]
              envFrom:
                - configMapRef: { name: platform-config }
                - secretRef: { name: platform-secrets }
              securityContext:
                {
                  allowPrivilegeEscalation: false,
                  readOnlyRootFilesystem: true,
                  capabilities: { drop: ["ALL"] },
                }
---
apiVersion: batch/v1
kind: CronJob
metadata:
