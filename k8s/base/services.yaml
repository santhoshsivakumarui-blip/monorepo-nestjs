apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: platform }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api-gateway
          image: platform/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          envFrom:
            [
              { configMapRef: { name: platform-config } },
              { secretRef: { name: platform-secrets } },
            ]
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: ["ALL"] },
            }
          readinessProbe:
            {
              httpGet: { path: /api/health, port: 3000 },
              initialDelaySeconds: 5,
            }
          livenessProbe:
            {
              httpGet: { path: /api/health, port: 3000 },
              initialDelaySeconds: 15,
            }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: platform }
spec:
  { selector: { app: api-gateway }, ports: [{ port: 80, targetPort: 3000 }] }
---
