apiVersion: v1
kind: ConfigMap
metadata: { name: platform-config, namespace: platform }
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: platform
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  RABBITMQ_URL: amqp://platform:platform@rabbitmq:5672
  ELASTICSEARCH_NODE: http://elasticsearch:9200
---
apiVersion: v1
kind: Secret
metadata: { name: platform-secrets, namespace: platform }
type: Opaque
stringData: { POSTGRES_USER: platform, POSTGRES_PASSWORD: change-me }
