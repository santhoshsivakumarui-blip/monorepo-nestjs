# Development-only in-cluster dependencies. Use managed equivalents in production.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: platform }
spec:
  serviceName: postgres
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env: [{ name: POSTGRES_DB, value: platform }, { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_USER } } }, { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } } }]
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: platform }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: platform }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec: { containers: [{ name: redis, image: redis:7-alpine, ports: [{ containerPort: 6379 }] }] }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: platform }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: platform }
spec:
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          env: [{ name: RABBITMQ_DEFAULT_USER, value: platform }, { name: RABBITMQ_DEFAULT_PASS, value: platform }]
          ports: [{ containerPort: 5672 }]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: platform }
spec: { selector: { app: rabbitmq }, ports: [{ port: 5672 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: platform }
spec:
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports: [{ containerPort: 9092 }]
          env: [{ name: KAFKA_NODE_ID, value: "1" }, { name: KAFKA_PROCESS_ROLES, value: broker\u002ccontroller }, { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: 1@kafka:29093 }, { name: KAFKA_LISTENERS, value: PLAINTEXT://:9092\u002cCONTROLLER://:29093 }, { name: KAFKA_ADVERTISED_LISTENERS, value: PLAINTEXT://kafka:9092 }, { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }, { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }, { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }]
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: platform }
spec: { selector: { app: kafka }, ports: [{ port: 9092 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: elasticsearch, namespace: platform }
spec:
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          env: [{ name: discovery.type, value: single-node }, { name: xpack.security.enabled, value: "false" }, { name: ES_JAVA_OPTS, value: -Xms512m\u0020-Xmx512m }]
          ports: [{ containerPort: 9200 }]
---
apiVersion: v1
kind: Service
metadata: { name: elasticsearch, namespace: platform }
spec: { selector: { app: elasticsearch }, ports: [{ port: 9200 }] }
