apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: platform, namespace: argocd }
spec:
  project: default
  source: { repoURL: https://github.com/REPLACE_ORG/REPLACE_REPO.git, targetRevision: main, path: helm/platform }
  destination: { server: https://kubernetes.default.svc, namespace: platform }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
