apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: platform-secrets, namespace: platform }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: platform-secret-store, kind: ClusterSecretStore }
  target: { name: platform-secrets, creationPolicy: Owner }
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: platform/production, property: jwt_secret }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: platform/production, property: postgres_password }
