apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-gateway }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: {{ .Release.Name }}-gateway } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-gateway } }
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3000 }]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe: { httpGet: { path: /api/health, port: 3000 }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /api/health/ready, port: 3000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 10 }
