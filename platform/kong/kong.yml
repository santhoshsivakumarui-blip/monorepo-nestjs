_format_version: "3.0"
services:
  - name: platform-gateway
    url: http://api-gateway:3000
    routes:
      - name: platform-api
        paths: [/]
plugins:
  - name: rate-limiting
    config: { minute: 100, policy: redis, redis_host: redis, redis_port: 6379 }
  - name: correlation-id
    config: { header_name: x-request-id, generator: uuid }
